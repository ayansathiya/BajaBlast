name: Android app

# Builds the phone app (android/) into an APK and publishes it at one link
# that never changes:
#
#   https://github.com/<owner>/<repo>/releases/download/android/baja-blast.apk
#
# Only when the app itself changes. The app shows the phone page from the
# kitchen's own server, so changes to app/mobile.html reach every phone
# without a new APK and without this workflow running at all.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The address parsing and the Wi-Fi sweep are plain Java, tested
      # against a fake kitchen before anything is built.
      - name: Test the address and discovery code
        run: |
          javac -d "$RUNNER_TEMP/t" \
            android/app/src/main/java/com/bajablast/phone/Address.java \
            android/app/src/main/java/com/bajablast/phone/Discovery.java \
            android/test/AddressTest.java
          java -cp "$RUNNER_TEMP/t" AddressTest

      # Android installs an update only over an app signed with the same key.
      # With the two repository secrets set (android/README.md), every build
      # is signed with the household's key and installs over the last one.
      # Without them the build is still made, signed with a throwaway key, and
      # the release says so plainly.
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/household.jks"
            echo "BAJA_ANDROID_KEYSTORE=$RUNNER_TEMP/household.jks" >> "$GITHUB_ENV"
            echo "BAJA_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=household" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set — signing with a throwaway key. See android/README.md."
            echo "signed=throwaway" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        env:
          BAJA_ANDROID_BUILD: ${{ github.run_number }}
        run: |
          export BAJA_ANDROID_VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "VERSION=$BAJA_ANDROID_VERSION" >> "$GITHUB_ENV"
          gradle -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk baja-blast.apk
          ls -la baja-blast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: baja-blast-apk
          path: baja-blast.apk

      # One release, tagged "android", whose APK is replaced each time — so
      # the download link above never changes and can live in a QR code.
      #
      # --prerelease and --latest=false are not cosmetic. Every kitchen box
      # asks GitHub for the *latest* release and expects the calendar payload
      # in it (app/updater.cjs); setup/armbian.sh downloads from it too. If
      # this release were ever "latest", every box would stop updating.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "household" ]; then
            SIGN="Signed with the household key, so it installs over the previous version."
          else
            SIGN="⚠️ Signed with a throwaway key (the signing secrets aren't set), so it won't install over an earlier copy — uninstall that first. See android/README.md."
          fi
          NOTES="$(printf 'The Baja Blast phone app, version %s.\n\n%s\n\nOn the phone: open this page, tap baja-blast.apk, allow installing from your browser when asked. The app finds the kitchen on your Wi-Fi by itself.' "$VERSION" "$SIGN")"
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Android app" --notes "$NOTES"
          fi
          gh release upload android baja-blast.apk --clobber
          gh release edit android --prerelease --latest=false --title "Android app ($VERSION)" --notes "$NOTES"
